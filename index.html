<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Monsoon Window</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1626;color:#eaf3f7;font-family:"Helvetica Neue","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button,select{font:inherit;color:inherit}
.glass,button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:.55em 1.1em;cursor:pointer;transition:background .3s,opacity .3s}
button:hover{background:rgba(255,255,255,.2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffc27a;outline-offset:2px}
#hud .top{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:8px;transition:opacity .4s}
#hud .bot{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:10px;justify-content:center;transition:opacity .4s}
#hud.hide .top,#hud.hide .bot{opacity:0;pointer-events:none}
#msg,#hint{position:fixed;left:0;right:0;text-align:center;font-weight:300;letter-spacing:.06em;text-shadow:0 1px 8px #000a;pointer-events:none;opacity:0;transition:opacity 1.2s;padding:0 16px}
#msg{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 64px);font-size:1.05rem}
#hint{top:14%;font-size:1.2rem}
#msg.on,#hint.on{opacity:.92}
#sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);max-height:80vh;overflow:auto;transform:translate(-50%,110%);transition:transform .35s ease;background:rgba(10,26,44,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.18);border-radius:24px 24px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom))}
#sheet.open{transform:translate(-50%,0)}
#sheet h2{font-weight:300;margin:0 0 12px;font-size:1.3rem}
#sheet label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:.95rem}
#sheet input[type=range]{width:55%;accent-color:#ffc27a}
#sheet select{background:#12304a;border:1px solid #fff3;border-radius:10px;padding:.3em .6em}
.scs{display:flex;gap:8px;margin-bottom:6px}
.sc{flex:1;padding:6px;border-radius:14px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.sc canvas{width:100%;border-radius:8px}
.sc[aria-pressed=true]{border-color:#ffc27a;background:rgba(255,194,122,.18)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:rgba(8,18,34,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:opacity 1.2s;z-index:5;text-align:center}
#start.gone{opacity:0;pointer-events:none}
#start h1{margin:0;font-weight:200;letter-spacing:.14em;font-size:clamp(34px,9vw,76px);text-shadow:0 0 30px #7fd0e066}
#bStart{font-size:1.15rem;padding:.8em 2.2em;background:rgba(255,190,100,.2);border-color:#ffc27a99;box-shadow:0 0 34px #ffb45a66;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 56px #ffb45aaa}}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 8s;z-index:4}
#dim.on{opacity:.93}
@media (prefers-reduced-motion:reduce){#bStart{animation:none}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="hint" role="status"></div><div id="msg" role="status"></div>
  <div class="top"><button id="bMute" aria-label="Mute sound">Sound on</button><button id="bGear" aria-label="Open settings">Settings</button></div>
  <div class="bot"><button id="bBreath" aria-label="Hold to breathe fog onto the glass">Breathe</button><button id="bDraw" aria-pressed="false" aria-label="Toggle draw mode">Draw</button></div>
</div>
<div id="sheet" role="dialog" aria-label="Settings" aria-hidden="true">
  <h2>Settings</h2>
  <div class="scs" id="scs"></div>
  <label>Rain intensity <input type="range" min="0" max="100" data-k="rain" aria-label="Rain intensity"></label>
  <label>Rain volume <input type="range" min="0" max="100" data-k="vr" aria-label="Rain volume"></label>
  <label>Music volume <input type="range" min="0" max="100" data-k="vm" aria-label="Music volume"></label>
  <label>Effects volume <input type="range" min="0" max="100" data-k="vf" aria-label="Effects volume"></label>
  <label>Fog regrow <select data-k="regrow" aria-label="Fog regrow speed"><option value="0">Off</option><option value="1">Slow</option><option value="2">Normal</option></select></label>
  <label>Merge sound <select data-k="chime" aria-label="Merge sound"><option value="0">Piano</option><option value="1">Wind chime</option></select></label>
  <label>Sleep timer <select id="sleep" aria-label="Sleep timer"><option value="0">Off</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option></select></label>
  <label>Draw mode <input type="checkbox" data-k="draw" aria-label="Draw mode"></label>
  <label>Haptics <input type="checkbox" data-k="haptic" aria-label="Haptics"></label>
  <label>Reduce motion <input type="checkbox" data-k="reduce" aria-label="Reduce motion"></label>
  <div class="row"><button id="bSnap">Save snapshot</button><button id="bReset">Reset garden</button><button id="bClose">Close</button></div>
</div>
<div id="start"><h1>Monsoon Window</h1><button id="bStart">Tap to Begin</button></div>
<div id="dim"></div>
<script>
'use strict';
/* ===== ARCHITECTURE =====
 Util/State -> SceneLib (3 scenes + rain + lightning) -> Fog -> Drops -> Plants -> Particles -> Sound (Web Audio) -> UI -> Game loop
 Render order: scene(bg canvas) -> blurred copy -> fog composite -> drops -> frame+sill -> plants -> particles -> vignette */

/* ---------- Util / State ---------- */
const $=s=>document.querySelector(s),TAU=Math.PI*2,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const H=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const S={scene:0,rain:.5,vr:.7,vm:.45,vf:.8,regrow:1,chime:0,draw:0,haptic:1,reduce:matchMedia('(prefers-reduced-motion:reduce)').matches?1:0,mute:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('mw_s')||'{}'))}catch(e){}
const saveS=()=>{try{localStorage.setItem('mw_s',JSON.stringify(S))}catch(e){}};
const buzz=ms=>{if(S.haptic&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};

/* ---------- SceneLib ---------- */
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function clouds(c,w,h,t,col){c.fillStyle=col;for(let i=0;i<4;i++){const x=((H(i)*w+t*(3+i*2))%(w+360))-180,y=h*(.07+H(i+5)*.2);c.beginPath();c.ellipse(x,y,110+H(i+9)*60,22+H(i+3)*14,0,0,TAU);c.fill()}}
function city(c,w,h,t,k){
  let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0a1033');g.addColorStop(.6,'#1a3a5e');g.addColorStop(1,'#2f5d6b');c.fillStyle=g;c.fillRect(0,0,w,h);
  clouds(c,w,h,t,'rgba(120,150,190,.13)');
  for(let L=0;L<2;L++){const base=h*(.8-L*.05),bw=w/8;
    for(let i=0;i<12;i++){const bx=i*bw*.85-20+L*34,bh=h*(.14+H(i+L*20)*.3)*(L?.8:1);
      c.fillStyle=L?'#142246':'#0a1430';c.fillRect(bx,base-bh,bw*.8,bh+h);
      if(!L)for(let wy=base-bh+10;wy<base-8;wy+=16)for(let wx=bx+7;wx<bx+bw*.8-9;wx+=14)if(H(wx*.13+wy*.7)<.15+.65*k){c.fillStyle='rgba(255,'+(185+H(wx)*45|0)+',110,.85)';c.fillRect(wx,wy,6,8)}}}
  c.fillStyle='#07101f';c.fillRect(0,h*.84,w,h);
  c.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){const x=w*(.18+i*.32),y=h*.7;c.fillStyle='#000';c.globalCompositeOperation='source-over';c.fillRect(x-1.5,y,3,h*.15);c.globalCompositeOperation='lighter';glow(c,x,y,90+k*40,'rgba(255,190,100,A)',.55+k*.3)}
  for(let i=0;i<14;i++)glow(c,((H(i)*w+t*(2+H(i+4)*3))%w),h*(.35+H(i+7)*.4),20+H(i+2)*40,i%3?'rgba(255,170,90,A)':'rgba(120,200,255,A)',.18);
  const cx=((t*.07)%1.5-.25)*w;glow(c,cx,h*.88,70,'rgba(255,90,70,A)',.7);glow(c,cx+50,h*.88,50,'rgba(255,240,200,A)',.6);
  c.globalCompositeOperation='source-over'}
function mountain(c,w,h,t,k){
  let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1a1b4b');g.addColorStop(.55,'#8d4f78');g.addColorStop(.85,'#e8a45c');g.addColorStop(1,'#f3c27a');c.fillStyle=g;c.fillRect(0,0,w,h);
  clouds(c,w,h,t,'rgba(255,200,180,.14)');
  const cols=['#6a5388','#4a3f73','#2c3460','#10203a'];
  for(let L=0;L<4;L++){const base=h*(.5+L*.1),amp=h*(.12-L*.01),dx=Math.sin(t*.02+L)*6;c.fillStyle=cols[L];c.beginPath();c.moveTo(0,h);
    for(let x=0;x<=w+8;x+=8)c.lineTo(x,base-Math.abs(Math.sin((x+dx)*.004*(1+L*.3)+L*3))*amp-Math.sin(x*.011+L)*amp*.25);
    c.lineTo(w,h);c.fill();
    if(L<3){const m=c.createLinearGradient(0,base-amp,0,base+20);m.addColorStop(0,'rgba(255,230,230,0)');m.addColorStop(1,'rgba(255,230,230,.22)');c.fillStyle=m;c.fillRect(((t*4+L*90)%w)-w*.5,base-20,w,60)}}
  const cx=w*.7,cy=h*.8;c.fillStyle='#0a1424';c.fillRect(cx-18,cy-14,36,14);c.beginPath();c.moveTo(cx-22,cy-14);c.lineTo(cx,cy-30);c.lineTo(cx+22,cy-14);c.fill();
  c.globalCompositeOperation='lighter';glow(c,cx,cy-8,50+k*30,'rgba(255,190,100,A)',.8);
  const n=4+(k*16|0);for(let i=0;i<n;i++){const fx=H(i)*w+Math.sin(t*.5+i*3)*30,fy=h*(.6+H(i+9)*.35)+Math.cos(t*.4+i)*20;glow(c,fx,fy,12,'rgba(230,255,140,A)',.5+.5*Math.sin(t*2+i))}
  c.globalCompositeOperation='source-over'}
function village(c,w,h,t,k){
  let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0e1838');g.addColorStop(1,'#3f5a82');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.globalCompositeOperation='lighter';glow(c,w*.8,h*.14,60,'rgba(220,235,255,A)',.5);c.globalCompositeOperation='source-over';
  c.fillStyle='#eaf0ff';c.beginPath();c.arc(w*.8,h*.14,13,0,TAU);c.fill();
  clouds(c,w,h,t,'rgba(150,170,210,.14)');
  c.fillStyle='#14263f';c.beginPath();c.moveTo(0,h);for(let x=0;x<=w+8;x+=8)c.lineTo(x,h*.72+Math.sin(x*.006)*h*.04);c.lineTo(w,h);c.fill();
  for(let i=0;i<4;i++){const bw=w*.17,bx=w*(.06+i*.23),by=h*(.74+Math.sin(bx*.006)*.04),bh=bw*.6;
    c.fillStyle='#0b1428';c.fillRect(bx,by-bh+8,bw,bh);c.beginPath();c.moveTo(bx-8,by-bh+8);c.lineTo(bx+bw/2,by-bh-bw*.32);c.lineTo(bx+bw+8,by-bh+8);c.fill();
    c.fillRect(bx+bw*.7,by-bh-bw*.3,8,22);
    for(let s=0;s<5;s++){const a=((t*.15+s*.2+i*.3)%1);c.fillStyle='rgba(190,205,230,'+(.18*(1-a))+')';c.beginPath();c.arc(bx+bw*.7+4+Math.sin(a*6+i)*8*a,by-bh-bw*.3-a*50,4+a*10,0,TAU);c.fill()}
    c.globalCompositeOperation='lighter';if(H(i+3)<.3+.7*k){glow(c,bx+bw*.3,by-bh*.45,38,'rgba(255,190,100,A)',.75)}c.globalCompositeOperation='source-over';
    if(i===1){const a=clamp((k-.3)*4,0,1);if(a>0){c.fillStyle='rgba(5,8,18,'+a+')';const cx=bx+bw*.3,cy=by-bh-bw*.32+bw*.12;c.beginPath();c.ellipse(cx,cy,14,7,0,0,TAU);c.arc(cx+13,cy-4,6,0,TAU);c.moveTo(cx+9,cy-8);c.lineTo(cx+11,cy-14);c.lineTo(cx+14,cy-8);c.moveTo(cx+14,cy-8);c.lineTo(cx+17,cy-14);c.lineTo(cx+18,cy-6);c.fill();c.strokeStyle='rgba(5,8,18,'+a+')';c.lineWidth=3;c.beginPath();c.moveTo(cx-12,cy);c.quadraticCurveTo(cx-24,cy+2,cx-22,cy-8);c.stroke()}}}
  const lx=w*.93,ly=h*.68;c.fillStyle='#000';c.fillRect(lx-1.5,ly,3,h*.12);c.globalCompositeOperation='lighter';glow(c,lx,ly,80,'rgba(255,190,100,A)',.7);c.globalCompositeOperation='source-over'}
const SCENES=[{n:'Sleepy city',f:city},{n:'Mountain dusk',f:mountain},{n:'Quiet village',f:village}];
function rainOut(c,w,h,t,q){const I=S.rain;c.lineCap='round';
  for(let L=0;L<2;L++){const n=((40+170*I)*q*(L?1:.6))|0,sp=L?900:520;c.strokeStyle='rgba(190,215,235,'+(L?.32:.16)+')';c.lineWidth=L?1.3:.8;c.beginPath();
    for(let i=0;i<n;i++){const x=(H(i+L*500)*w*1.2+((t*sp*.2)%w)*.05)%w,y=((t*sp+H(i*3+L)*h*2)%(h+60))-30,len=L?24:14;c.moveTo(x,y);c.lineTo(x-len*.12,y+len)}c.stroke()}}

/* ---------- Fog ---------- */
class Fog{
  constructor(){this.cv=document.createElement('canvas');this.c=this.cv.getContext('2d');this.br=document.createElement('canvas');this.br.width=this.br.height=64;
    const b=this.br.getContext('2d'),g=b.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.75)');g.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=g;b.fillRect(0,0,64,64);
    this.sm=document.createElement('canvas');this.sm.width=24;this.sm.height=32;this.sc=this.sm.getContext('2d',{willReadFrequently:true});this.t=0}
  init(W,H,s){this.s=s;this.cv.width=W*s|0;this.cv.height=H*s|0;this.refill()}
  refill(){this.c.globalCompositeOperation='source-over';this.c.fillStyle='rgba(255,255,255,.97)';this.c.fillRect(0,0,this.cv.width,this.cv.height)}
  erase(x,y,r,a){const c=this.c,s=this.s;c.globalCompositeOperation='destination-out';c.globalAlpha=a;c.drawImage(this.br,(x-r)*s,(y-r)*s,r*2*s,r*2*s);c.globalAlpha=1}
  wipe(x0,y0,x1,y1,r){const d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/(r*.35)));
    for(let i=1;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;this.erase(x,y,r,.9);
      if(Math.random()<.05){const a=rnd(0,TAU),c=this.c,s=this.s,px=x+Math.cos(a)*r*.8,py=y+Math.sin(a)*r*.8;c.globalCompositeOperation='destination-out';c.lineWidth=1.6*s;c.lineCap='round';c.strokeStyle='rgba(0,0,0,.7)';c.beginPath();c.moveTo(px*s,py*s);c.lineTo(px*s,(py+rnd(10,34))*s);c.stroke()}}}
  line(x0,y0,x1,y1){const c=this.c,s=this.s;c.globalCompositeOperation='destination-out';c.strokeStyle='#000';c.lineWidth=3.2*s;c.lineCap='round';c.beginPath();c.moveTo(x0*s,y0*s);c.lineTo(x1*s,y1*s);c.stroke()}
  heart(x,y,z){const c=this.c,s=this.s;c.globalCompositeOperation='destination-out';c.strokeStyle='#000';c.lineWidth=3*s;c.beginPath();c.moveTo(x*s,(y+z*.9)*s);c.bezierCurveTo((x-z*1.6)*s,(y-z*.2)*s,(x-z*.6)*s,(y-z*1.3)*s,x*s,(y-z*.4)*s);c.bezierCurveTo((x+z*.6)*s,(y-z*1.3)*s,(x+z*1.6)*s,(y-z*.2)*s,x*s,(y+z*.9)*s);c.stroke()}
  regrow(a){const c=this.c;c.globalCompositeOperation='source-over';c.fillStyle='rgba(255,255,255,'+a+')';c.fillRect(0,0,this.cv.width,this.cv.height)}
  cleared(){this.sc.clearRect(0,0,24,32);this.sc.drawImage(this.cv,0,0,24,32);const d=this.sc.getImageData(0,0,24,32).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]<120)n++;return n/768}
}

/* ---------- Drops (pooled) ---------- */
class Drops{
  constructor(){this.a=[];for(let i=0;i<90;i++)this.a.push({on:0,x:0,y:0,r:3,vx:0,vy:0,sq:0,rip:0,drag:-1,id:i,slide:0})}
  spawn(x,y,r){for(const d of this.a)if(!d.on){Object.assign(d,{on:1,x,y,r,vx:0,vy:0,sq:0,rip:0,drag:-1,slide:0});return d}return null}
  pick(x,y){let b=null,bd=1e9;for(const d of this.a)if(d.on){const e=Math.hypot(d.x-x,d.y-y);if(e<d.r+18&&e<bd){b=d;bd=e}}return b}
  update(dt,G){const max=(70*G.q)|0,live=this.a.filter(d=>d.on).length;
    if(live<max&&Math.random()<dt*(.8+S.rain*7)){const r=rnd(2,4.6);this.spawn(G.gx+rnd(0,G.gw),G.gy+rnd(0,G.gh*.9),r)}
    for(const d of this.a){if(!d.on)continue;d.sq=Math.max(0,d.sq-dt*3);d.rip=Math.max(0,d.rip-dt*1.5);
      if(d.drag<0){const tv=d.r>5.6?(d.r-4)*26:0;if(d.r<=5.6&&d.r>4&&Math.random()<dt*.04)d.vy=30;d.vy+=(tv-d.vy)*dt*(d.vy>tv?.6:1.4);d.vx*=1-dt*2;
        d.y+=d.vy*dt;d.x+=d.vx*dt+(d.vy>5?Math.sin(G.t*5+d.id)*dt*5:0);
        if(d.vy>12&&G.fog)G.fog.erase(d.x,d.y-d.r*.4,d.r*1.1,.55)}
      if(d.y>G.gy+G.gh-2){G.plants.water(d,G);d.on=0}else if(d.x<G.gx-10||d.x>G.gx+G.gw+10)d.on=0}
    for(let i=0;i<this.a.length;i++){const p=this.a[i];if(!p.on)continue;
      for(let j=i+1;j<this.a.length;j++){const q=this.a[j];if(!q.on||(p.r<3&&q.r<3))continue;
        if(Math.hypot(p.x-q.x,p.y-q.y)<(p.r+q.r)*.85){const A=p.r*p.r,B=q.r*q.r,T=A+B;
          p.x=(p.x*A+q.x*B)/T;p.y=(p.y*A+q.y*B)/T;p.vx=(p.vx*A+q.vx*B)/T;p.vy=(p.vy*A+q.vy*B)/T;p.r=Math.min(18,Math.sqrt(T));p.sq=1;p.rip=1;
          if(q.drag>=0)p.drag=q.drag,G.ptrs.forEach(o=>{if(o.drop===q)o.drop=p});q.on=0;G.snd.note(p.r);buzz(8)}}}}
  draw(c,G){for(const d of this.a){if(!d.on)continue;const r=d.r,ry=r*(1+Math.min(.25,d.vy/160)-.2*d.sq),rx=r*(1+.2*d.sq),dp=G.dpr;
    c.save();c.beginPath();c.ellipse(d.x,d.y,rx,ry,0,0,TAU);c.clip();c.translate(d.x,d.y);c.scale(1,-1);
    c.drawImage(G.bg,(d.x-r*1.6)*dp,(d.y-r*1.6)*dp,r*3.2*dp,r*3.2*dp,-rx,-ry,rx*2,ry*2);c.scale(1,-1);
    c.fillStyle='rgba(170,205,230,.14)';c.fillRect(-rx,-ry,rx*2,ry*2);
    const g=c.createRadialGradient(0,0,r*.4,0,0,r*1.1);g.addColorStop(0,'rgba(0,10,25,0)');g.addColorStop(1,'rgba(0,10,25,.5)');c.fillStyle=g;c.fillRect(-rx,-ry,rx*2,ry*2);c.restore();
    c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.ellipse(d.x-rx*.35,d.y-ry*.4,Math.max(.8,r*.2),Math.max(.6,r*.14),-.6,0,TAU);c.fill();
    c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=1;c.beginPath();c.arc(d.x,d.y,r*.78,.3,1.9);c.stroke();

$('#bStart').onclick=begin;
$('#bGear').onclick=()=>{$('#sheet').classList.add('open');$('#sheet').setAttribute('aria-hidden','false');wake()};
const closeS=()=>{$('#sheet').classList.remove('open');$('#sheet').setAttribute('aria-hidden','true');wake()};
$('#bClose').onclick=closeS;addEventListener('keydown',e=>{if(e.key==='Escape')closeS()});
$('#bMute').onclick=()=>{S.mute=S.mute?0:1;$('#bMute').textContent=S.mute?'Sound off':'Sound on';saveS();G.snd.mute()};
const br=$('#bBreath');['pointerdown'].forEach(n=>br.addEventListener(n,()=>{G.breath=true}));['pointerup','pointerleave','pointercancel'].forEach(n=>br.addEventListener(n,()=>{G.breath=false}));
br.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){G.breath=true;G.fog.regrow(.3)}});br.addEventListener('keyup',()=>{G.breath=false});
function syncDraw(){$('#bDraw').setAttribute('aria-pressed',!!S.draw);$('#bDraw').style.borderColor=S.draw?'#ffc27a':'';document.querySelector('[data-k=draw]').checked=!!S.draw}
$('#bDraw').onclick=()=>{S.draw=S.draw?0:1;saveS();syncDraw()};
document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k,ck=el.type==='checkbox',rg=el.type==='range';el.value=rg?S[k]*100:S[k];if(ck)el.checked=!!S[k];
  el.addEventListener('input',()=>{S[k]=ck?+el.checked:rg?el.value/100:+el.value;saveS();G.snd.setVols();G.snd.setRain();syncDraw()})});
$('#sleep').onchange=e=>G.snd.sleep(+e.target.value);
const scs=$('#scs');SCENES.forEach((s,i)=>{const b=document.createElement('button'),cn=document.createElement('canvas');cn.width=84;cn.height=54;b.className='sc';b.setAttribute('aria-label','Scene: '+s.n);b.append(cn,s.n);
  const x=cn.getContext('2d');x.scale(84/300,54/190);s.f(x,300,190,4,.5);b.onclick=()=>{S.scene=i;saveS();sync()};scs.append(b)});
function sync(){[...scs.children].forEach((b,i)=>b.setAttribute('aria-pressed',S.scene===i))}
$('#bReset').onclick=()=>{G.plants.reset();say($('#msg'),'The garden starts fresh.',3500)};
$('#bSnap').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='monsoon-window.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});
document.addEventListener('visibilitychange',()=>{G.snd.hidden(document.hidden);last=performance.now();if(!document.hidden&&G.started)try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}});
addEventListener('resize',resize);
$('#bMute').textContent=S.mute?'Sound off':'Sound on';sync();syncDraw();resize();requestAnimationFrame(loop);
</script></body></html>
